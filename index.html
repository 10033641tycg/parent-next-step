<!doctype html>
<html lang="zh-Hant-TW">
<head>

<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#2b2a28; --muted:#6b675f; --line:#e4ded3;
  --accent:#2f6f6a; --accent-ink:#ffffff; --accent-soft:#e3efed;
  --warn:#a8442f; --warn-soft:#f7e6e1; --dont:#8a5a12; --dont-soft:#faf0dc;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1d1c; --card:#252827; --ink:#ece8e1; --muted:#a8a39a; --line:#383c3a;
    --accent:#6fb5ad; --accent-ink:#10201e; --accent-soft:#233a37;
    --warn:#e58b74; --warn-soft:#3a2722; --dont:#e0b35e; --dont-soft:#3a3020;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1d1c; --card:#252827; --ink:#ece8e1; --muted:#a8a39a; --line:#383c3a;
  --accent:#6fb5ad; --accent-ink:#10201e; --accent-soft:#233a37;
  --warn:#e58b74; --warn-soft:#3a2722; --dont:#e0b35e; --dont-soft:#3a3020;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:17px; line-height:1.75; letter-spacing:.02em;
}
.top{
  position:sticky; top:0; z-index:5; background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:10px 16px; display:flex; align-items:center; gap:10px;
}
.brand{font-weight:700; font-size:15px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.exit{
  border:0; background:var(--warn); color:#fff; font:inherit; font-size:14px; font-weight:700;
  padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap;
}
main{max-width:640px; margin:0 auto; padding:20px 16px 48px}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:16px}
h1{font-size:26px; line-height:1.4; margin:4px 0 12px}
h2{font-size:21px; line-height:1.45; margin:0 0 12px}
h3{font-size:17px; margin:0 0 8px}
p{margin:0 0 12px}
.lead{color:var(--muted)}
.step-tag{display:inline-block; font-size:13px; color:var(--accent); background:var(--accent-soft); padding:2px 10px; border-radius:999px; margin-bottom:10px; font-weight:600}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:8px}
.opt{
  text-align:left; font:inherit; color:var(--ink); background:var(--card);
  border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer;
  transition:border-color .15s, background .15s;
}
.opt:hover,.opt:focus-visible{border-color:var(--accent); background:var(--accent-soft); outline:none}
.opt b{display:block; font-size:17px}
.opt span{display:block; font-size:14px; color:var(--muted); margin-top:2px}
.btn{
  display:inline-block; font:inherit; font-weight:700; border:0; border-radius:12px;
  padding:12px 18px; cursor:pointer; background:var(--accent); color:var(--accent-ink); text-decoration:none;
}
.btn.ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.nav{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
.say{background:var(--accent-soft); border-radius:14px; padding:16px; margin-bottom:16px}
.say h3{color:var(--accent)}
.say ul{margin:0; padding-left:0; list-style:none}
.say li{margin:6px 0; padding-left:14px; border-left:3px solid var(--accent)}
.say .avoid{margin-top:10px; font-size:15px; color:var(--muted)}
ol.todo{list-style:none; margin:0; padding:0; counter-reset:t}
ol.todo li{counter-increment:t; display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
ol.todo li:first-child{border-top:0}
ol.todo input{width:22px; height:22px; margin-top:4px; accent-color:var(--accent); flex:none}
ol.todo .n::before{content:counter(t) "．"; font-weight:700; color:var(--accent)}
ol.todo li.done .txt{opacity:.5}
ol.todo .txt b{display:block}
ol.todo .txt small{display:block; color:var(--muted); font-size:15px; line-height:1.65; margin-top:2px}
.dont{background:var(--dont-soft); border-radius:14px; padding:16px; margin-bottom:16px}
.dont h3{color:var(--dont)}
.dont ul{margin:0; padding-left:20px}
.dont li{margin:4px 0}
.urgent{background:var(--warn-soft); border:1.5px solid var(--warn); border-radius:16px; padding:20px; margin-bottom:16px}
.urgent h2{color:var(--warn)}
.res{display:flex; flex-direction:column; gap:10px}
.r{border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center}
.r .info{flex:1; min-width:0}
.r .info b{display:block}
.r .info small{display:block; color:var(--muted); font-size:14px; line-height:1.55}
.r a{flex:none; font-weight:700; color:var(--accent-ink); background:var(--accent); text-decoration:none; padding:8px 12px; border-radius:10px; font-size:15px; white-space:nowrap}
.r a.web{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.r .acts{display:flex; flex-direction:column; gap:6px}
details{border-top:1px solid var(--line); padding:12px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer; font-weight:700; list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ "; color:var(--accent)}
details[open] summary::before{content:"－ "}
details p,details ul{margin:8px 0 0; color:var(--ink)}
details ul{padding-left:20px}
.note{font-size:14px; color:var(--muted)}
.foot{font-size:13px; color:var(--muted); text-align:center; margin-top:24px; line-height:1.7}
.progress{height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:16px}
.progress i{display:block; height:100%; background:var(--accent); transition:width .3s}
.door{display:block; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; margin-bottom:12px; box-shadow:var(--shadow)}
.door:hover,.door:focus-visible{border-color:var(--accent); outline:none}
.door.hot{border-color:var(--warn)}
.door b{display:block; font-size:19px; margin-bottom:4px}
.door.hot b{color:var(--warn)}
.door span{display:block; font-size:15px; color:var(--muted)}
.sec{margin-bottom:16px}
.sec:last-child{margin-bottom:0}
.sec h3{color:var(--accent)}
.sec ul{margin:0 0 8px; padding-left:20px}
.sec li{margin:4px 0}
.quote{background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; padding:10px 14px; margin:8px 0}
.quote p{margin:4px 0}
.bad{background:var(--dont-soft); border-left:3px solid var(--dont); border-radius:0 10px 10px 0; padding:10px 14px; margin:8px 0; font-size:15px}
.bad p{margin:4px 0}
.linkbtn{display:block; width:100%; text-align:left; font:inherit; font-weight:700; color:var(--accent); background:var(--accent-soft); border:0; border-radius:12px; padding:14px 16px; cursor:pointer; margin-bottom:16px}
@media print{
  .top,.nav,.exit,.progress,.no-print{display:none!important}
  body{background:#fff; color:#000; font-size:13px}
  .card,.say,.dont,.urgent{box-shadow:none; border:1px solid #bbb; break-inside:avoid}
  details{display:block} details>*{display:block}
}
</style>
</head>

  else if(n.type === "menu"){
    h += '<div class="card"><span class="step-tag">'+esc(n.tag)+'</span><h2>'+esc(n.title)+'</h2><p class="lead">'+esc(n.lead)+'</p></div>';
    n.items.forEach(function(it){
      if(!N[it.go]) return;
      h += '<button class="door" data-go="'+it.go+'"><b>'+esc(it.t)+'</b><span>'+esc(it.s)+'</span></button>';
    });
    h += '<div class="nav no-print"><button class="btn ghost" data-go="after">回到事後單元</button>'+
      '<button class="btn ghost" data-act="restart">回首頁</button></div>';
  }

  else if(n.type === "hub"){
    h += '<div class="card"><span class="step-tag">'+esc(n.tag)+'</span><h2>'+esc(n.title)+'</h2><p class="lead">'+esc(n.lead)+'</p>'+
      '<p><b>錯在騙人、威脅人的那一方。</b></p></div>';
    n.items.forEach(function(it){
      h += '<button class="door" data-go="'+it.go+'"><b>'+esc(it.t)+'</b><span>'+esc(it.s)+'</span></button>';
    });
    h += '<div class="card"><h2>有新的狀況時</h2>'+
      '<p>對方再次聯繫、發現影像出現在網路上、孩子情緒明顯變差，請主動聯繫負責你們的社工或承辦員警。</p>'+
      '<div class="res">';
    n.res.forEach(function(r){ h += resItem(r); });
    h += '</div></div>'+nav(stack.length>0);
  }

  else if(n.type === "guide"){
    h += '<div class="card"><span class="step-tag">'+esc(n.tag)+'</span><h2>'+esc(n.title)+'</h2><p class="lead">'+esc(n.lead)+'</p></div>';
    if(n.more) h += '<button class="linkbtn no-print" data-go="'+n.more.go+'">'+esc(n.more.t)+'</button>';
    h += '<div class="card">';
    n.secs.forEach(function(s){
      h += '<div class="sec"><h3>'+esc(s.h)+'</h3>';
      (s.p||[]).forEach(function(x){ h += '<p>'+esc(x)+'</p>'; });
      if(s.list){ h += '<ul>'; s.list.forEach(function(x){ h += '<li>'+esc(x)+'</li>'; }); h += '</ul>'; }
      if(s.say){ h += '<div class="quote">'; s.say.forEach(function(x){ h += '<p>'+esc(x)+'</p>'; }); h += '</div>'; }
      if(s.bad){ h += '<div class="bad">'; s.bad.forEach(function(x){ h += '<p>・'+esc(x)+'</p>'; }); h += '</div>'; }
      if(s.p2) h += '<p class="note">'+esc(s.p2)+'</p>';
      h += '</div>';
    });
    h += '</div>';
    if(n.res){
      h += '<div class="card"><h2>可以找誰幫忙</h2><div class="res">';
      n.res.forEach(function(r){ h += resItem(r); });
      h += '</div></div>';
    }
    h += '<div class="nav no-print">'+
      '<button class="btn" data-act="print">列印或存成 PDF</button>'+
      (stack.length?'<button class="btn ghost" data-act="back">上一頁</button>':'')+
      '<button class="btn ghost" data-go="after">回到事後單元</button>'+
      '<button class="btn ghost" data-act="restart">回首頁</button></div>';
  }

  h += '<p class="foot">資源資訊查核：2026 年 10 月<br>本指引為一般性資訊，不取代專業人員的個別評估</p>';
  app.innerHTML = h;
  var first = app.querySelector("h1,h2");
  if(first){ first.setAttribute("tabindex","-1"); first.focus({preventScroll:true}); }
}

function go(id){ stack.push(current); current = id; render(id); }
var current = "start";

app.addEventListener("click", function(e){
  var t = e.target.closest("[data-go],[data-act]");
  if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  var a = t.dataset.act;
  if(a === "back" && stack.length){ current = stack.pop(); render(current); }
  else if(a === "restart"){ stack = []; checks = {}; current = "start"; render(current); }
  else if(a === "print"){ window.print(); }
});

app.addEventListener("change", function(e){
  var c = e.target;
  if(c.matches('input[type="checkbox"][data-key]')){
    checks[c.dataset.key] = c.checked;
    c.closest("li").classList.toggle("done", c.checked);
  }
});

document.getElementById("exitBtn").addEventListener("click", function(){
  app.innerHTML = "";
  window.location.replace("https://www.google.com/");
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ document.getElementById("exitBtn").click(); }
});

render(current);
})();
</script>
</body>
</html>
